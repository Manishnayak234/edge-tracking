<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-labelledby="title desc">
  <title id="title">Hardware setup</title>
  <desc id="desc">An IMX219 camera connects to the Jetson Orin Nano Super over MIPI CSI-2. The Jetson runs capture, TensorRT and ByteTrack, and sends sweep or stop commands over USB serial to an Arduino, which drives an SG90 servo on pin D9. A PC connects to the Jetson over SSH on the local network.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .box { fill: #f5f4f1; stroke: #c3c2b7; stroke-width: 1; }
    .main { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 1.5; }
    .ink { fill: #0b0b0b; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ink2 { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .muted { fill: #6b6a65; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wire { stroke: #898781; stroke-width: 2; fill: none; }
    .lan { stroke: #898781; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #898781; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .box { fill: #242423; stroke: #383835; }
      .main { fill: #16263a; stroke: #3987e5; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .muted { fill: #a3a29b; }
      .wire, .lan { stroke: #898781; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="surface" width="820" height="290" rx="8"/>

  <!-- PC -->
  <rect class="box" x="290" y="20" width="160" height="52" rx="8"/>
  <text class="ink" x="370" y="42" text-anchor="middle">PC</text>
  <text class="ink2" x="370" y="60" text-anchor="middle">model export, charts</text>
  <path class="lan" d="M370,72 L370,124" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="muted" x="380" y="102">SSH over LAN</text>

  <!-- Camera -->
  <rect class="box" x="20" y="132" width="150" height="92" rx="8"/>
  <text class="ink" x="95" y="168" text-anchor="middle">IMX219 camera</text>
  <text class="ink2" x="95" y="188" text-anchor="middle">1280×720 @ 60 fps</text>

  <!-- Jetson -->
  <rect class="main" x="255" y="128" width="230" height="100" rx="8"/>
  <text class="ink" x="370" y="158" text-anchor="middle">Jetson Orin Nano Super</text>
  <text class="ink2" x="370" y="180" text-anchor="middle">Argus → CUDA → TensorRT</text>
  <text class="ink2" x="370" y="198" text-anchor="middle">YOLOv8n → ByteTrack</text>
  <text class="muted" x="370" y="216" text-anchor="middle">edge-tracking</text>

  <!-- Arduino -->
  <rect class="box" x="580" y="132" width="110" height="92" rx="8"/>
  <text class="ink" x="635" y="168" text-anchor="middle">Arduino</text>
  <text class="ink2" x="635" y="188" text-anchor="middle">Uno / Nano</text>

  <!-- Servo -->
  <rect class="box" x="730" y="132" width="70" height="92" rx="8"/>
  <text class="ink" x="765" y="168" text-anchor="middle">SG90</text>
  <text class="ink2" x="765" y="188" text-anchor="middle">servo</text>

  <!-- Links -->
  <path class="wire" d="M170,178 L253,178" marker-end="url(#arrow)"/>
  <text class="muted" x="212" y="170" text-anchor="middle">MIPI CSI-2</text>

  <path class="wire" d="M485,178 L578,178" marker-end="url(#arrow)"/>
  <text class="muted" x="532" y="170" text-anchor="middle">USB serial</text>
  <text class="muted" x="532" y="198" text-anchor="middle">S sweep</text>
  <text class="muted" x="532" y="213" text-anchor="middle">X stop</text>

  <path class="wire" d="M690,178 L728,178" marker-end="url(#arrow)"/>
  <text class="muted" x="710" y="170" text-anchor="middle">D9</text>

  <text class="muted" x="20" y="268">Servo power: 5V and GND from the Arduino (use a separate 5V supply if it stutters). The servo sweeps while a person is in view.</text>
</svg>
